# Render Blueprint: nur der Multiplayer-Spielserver (WebSocket + Health-Check).
# Das Spiel selbst läuft auf Toki (Branch `toki`). In Render: «New» → «Blueprint» → dieses Repository.
services:
  - type: web
    name: blockcraft-server
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @blockcraft/server build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Herkunft(en), von denen das Spiel per WebSocket verbinden darf (kommagetrennt).
      # Anpassen, falls Toki die Spiele unter einer anderen Domain ausliefert.
      - key: ALLOWED_ORIGINS
        value: https://toki-ashy.vercel.app
      - key: MAX_ROOMS
        value: '3'
      - key: MAX_PLAYERS_PER_ROOM
        value: '4'
      - key: MAX_VIEW_DISTANCE
        value: '6'
      - key: LOG_LEVEL
        value: info
